local_development: False

camera:
  name: Sony
  mode: video
  program: MovieM
  ISO: 100
  shutter_speed: 0.000625
  focus_distance: infinity

sensors:
    GPS_1:
      name: ZED-F9P
      connection:
        type: serial
        parameters:
          port: /dev/ttyAMA0
          baudrate: 38400
      sensor_info:
        type: GPS
        manufacturer: UBlox
    
    Inclinometer_1:
      name: Kernel-100
      connection:
        type: serial
        parameters:
          port: /dev/ttyAMA5
          baudrate: 115200
      sensor_info:
        type: Inclinometer
        manufacturer: Inertial_Labs
      configuration:
        mode: KERNEL_CalibHR
    
    ADC_1:
      name: ADS1015
      connection:
        type: I2C
        parameters:
          bus: 6
          address: 0x48
          mode: differential
          channels: [0,1]
      sensor_info:
          type: ADC
          manufacturer: ADS
      configuration: 
        gain: 16
        adc_rate: 1600
        reading_rate: 350
        
    DAC_1:
      name: MCP4725
      connection:
        type: I2C
        parameters:
          bus: 1
          address: 0x60
      sensor_info:
          type: DAC
          manufacturer: MCP
      configuration: 
        voltage: 1.02
        max_voltage: 3.3

source:
  name: VALON-5019
  port: /dev/ttyAMA4
  baudrate: 115200
  freq: 93
  power: -6.5
  mod_amp: 15
  mod_freq: 37
  mult_factor: 6


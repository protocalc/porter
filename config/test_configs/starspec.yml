local_development: False


sensors:
    GPS_1:
      name: ZED-F9P
      connection:
        type: serial
        parameters:
          port: /dev/ttyAMA0
          baudrate: 115200
      sensor_info:
        type: GPS
        manufacturer: UBlox
      configuration:
        NMEA1:
          output:
            port: UART1
            set: False
        NMEA2:
          output:
            port: UART2
            set: True
        UBX:
          output:
            port: UART1
            set: True
        RATE:
          value: 2
        UBX_MSG:
          output_port: UART1
          NAV: [
            'POSECEF',
            'POSLLH'
            ]
          RXM: [
            'RAWX',
            'SFRBX'
            ]
        NMEA_MSG:
          output_port: UART2
          ID : [
            'GGA',
            'GSV',
            'GSA',
            'GST',
            'GNS',
            'ZDA'
          ]
    
    ADC_1:
      name: ADS1015
      connection:
        type: I2C
        parameters:
          bus: 6
          address: 0x48
          mode: differential
          channels: [0,1]
          output: voltage
      sensor_info:
          type: ADC
          manufacturer: ADS
      configuration: 
        gain: 2
        data_rate: 490
